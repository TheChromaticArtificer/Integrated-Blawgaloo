#Removed items are hidden from JEI and creative tabs, their recipes are dropped, they turn into their replacement
#(or vanish) in loot and inventories, and their ores stop generating. Changes apply after a restart.
[removals]
	#Infinity Gauntlet's own gauntlets and stones become this mod's.
	infinityGauntletDuplicates = true
	#Infinity Gauntlet's uru becomes Marvel's uru ingot; raw uru, uru ore, the uru star, the smithing template and the netherite stick are removed.
	uruMaterials = true
	#Infinity Gauntlet's Mjolnir becomes Marvel's and its Sceptre becomes the Mind Stone; the Cosmi Rods, Stone Tracker and Suit-Case are removed.
	infinityGauntletExtras = true
	#Marvel's titanium becomes Antarchy titanium.
	titanium = true
	#Palladium ingots and blocks become netherite; the rest of palladium is removed. The Palladium Arc Reactor becomes the Netherite Arc Reactor.
	palladium = true
	#Proto-adamantium becomes adamantium.
	protoAdamantium = true
	#Hydra bricks, slabs, stairs, walls and lamps are removed.
	hydraBricks = true
	#Marvel's syringe, reinforced leather, web shooter and web fluid give way to Marvel Legacy's. Legacy's empty syringe draws villager blood.
	legacyMerge = true
	#Hide the items suits hand out for their abilities (claws, blasts, repulsors, the drill and so on) from JEI and creative tabs.
	hideSuitAbilityItems = true

[creative]
	#Show Marvel, Marvel Legacy, Infinity Gauntlet and this mod in one creative tab, grouped by kind. JEI follows the same order.
	unifiedTab = true
