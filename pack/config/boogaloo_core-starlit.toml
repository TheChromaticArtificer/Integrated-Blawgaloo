#Tamed Antarchy Glimmers shed Pastel stardust now and then.
[glimmer_stardust]
	#Average ticks between drops per tamed Glimmer (9000 = 7.5 minutes). 0 disables.
	# Default: 9000
	# Range: 0 ~ 1000000
	average_ticks = 9000
	night_only = false

