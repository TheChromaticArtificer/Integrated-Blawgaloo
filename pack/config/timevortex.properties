# The Time Vortex Mod: the rules of the game (read by the server, and sent to everyone on it).
# Edit here or on the in-game settings screen. A change here is picked up within a second or two, no restart
# needed.

# ======== General ========

# Easy mode: The same steps with about half the ingredients, machine time and power, and artron at half price.
# A first flight in 2 to 4 hours instead of 6 to 10. (default false; true or false)
easy_mode=false

# Machine time: Multiplies how long every machine recipe takes. (default 1; 0.05 to 20)
machine_time=1

# Machine power: Multiplies the artron every machine recipe uses. (default 1; 0.05 to 20)
machine_power=1

# Handbook on joining: Give each player a TARDIS Handbook the first time they join a world. (default true;
# true or false)
handbook_on_join=false

# ======== Artron Fuel ========

# Fuel needed: Off: flying, trips and the cloak cost no artron. (default true; true or false)
fuel_needed=true

# Lift-off cost: Artron to lift off, for a small hull. (default 500; 0 to 1,000,000)
lift_off_cost=500

# Hull cost blocks: Every cost goes up by its own amount again for each this many hull blocks. (default 500; 1
# to 100,000)
hull_cost_blocks=500

# Flight cost: Artron a tick while flying, for a small hull. (default 1; 0 to 10,000)
flight_cost=1

# Flight cost per notch: Extra artron a tick for each throttle notch. (default 1; 0 to 10,000)
flight_cost_per_notch=1

# Trip cost: Artron for a trip through the vortex, before distance. (default 2000; 0 to 10,000,000)
trip_cost=2000

# Trip cost per 100 blocks: Extra trip artron for every 100 blocks travelled. (default 25; 0 to 100,000)
trip_cost_per_100_blocks=25

# Other dimension cost: Extra trip artron to go to another dimension. (default 3000; 0 to 10,000,000)
other_dimension_cost=3000

# Refund called-off trips: Calling off a demat gives the trip's artron back. (default true; true or false)
demat_refund=true

# Cloak cost: Artron a second while cloaked. (default 5; 0 to 100,000)
cloak_cost=5

# Fluid Link needed: A console needs a Fluid Link before artron flows into it. (default true; true or false)
fluid_link_needed=true

# Artron Cell capacity: Artron each Artron Cell holds. (default 50000; 1,000 to 100,000,000)
artron_cell_capacity=50000

# Console charge rate: Most artron a console takes in a tick. (default 400; 1 to 1,000,000)
console_charge_rate=400

# Rift charging: Artron a tick a console draws from a rift near it. (default 40; 0 to 100,000)
console_rift_draw=0

# Rift charging range: How near a rift must be to charge a console. (default 4; 0 to 32)
console_rift_range=4

# Wireless charging range: Artron Capacitors this near a hull charge it without conduits (0: only those built
# into it). (default 4; 0 to 32)
wireless_charging_range=4

# ======== Flight ========

# Flight speed: Multiplies how fast a TARDIS flies at each throttle notch. (default 1; 0.1 to 5)
flight_speed=1

# Climb speed: Multiplies how fast it climbs and sinks. (default 1; 0.1 to 5)
climb_speed=1

# Crash damage: Flying into something hard can damage a console module. (default true; true or false)
crash_damage=true

# Crash damage chance: Chance a hard crash damages a module. (default 0.35; 0 to 1)
crash_damage_chance=0.35

# Crash speed: Speed lost in one hit (blocks a tick) that counts as a hard crash. (default 1; 0.1 to 10)
crash_speed=1

# ======== Hull ========

# Hull limit: Most hull blocks with no Hull Stabiliser. (default 64; 1 to 100,000)
hull_limit=64

# Hull limit I: Most hull blocks with a Hull Stabiliser I. (default 150; 1 to 100,000)
hull_limit_1=150

# Hull limit II: Most hull blocks with a Hull Stabiliser II. (default 600; 1 to 100,000)
hull_limit_2=600

# Hull limit III: Most hull blocks with a Hull Stabiliser III. (default 2500; 1 to 100,000)
hull_limit_3=2500

# Glue box size: Longest side of one Hull Glue box. (default 32; 2 to 128)
glue_box_size=32

# Refuse unbreakable blocks: A hull can't take blocks nothing can break (bedrock, portals). The
# timevortex:hull_denied tag lists more. (default true; true or false)
unbreakable_refused=true

# ======== Navigation ========

# Landing scatter: How far from the mark it may land with no Navigation Calibrator. (default 32; 0 to 1,000)
landing_scatter=32

# Landing scatter I: How far from the mark with a Navigation Calibrator I. (default 12; 0 to 1,000)
landing_scatter_1=12

# Landing scatter II: How far from the mark with a Navigation Calibrator II. (default 3; 0 to 1,000)
landing_scatter_2=3

# Landing scatter III: How far from the mark with a Navigation Calibrator III. (default 0; 0 to 1,000)
landing_scatter_3=0

# Stabiliser needed: Going to another dimension needs a Dimensional Stabiliser. (default true; true or false)
stabiliser_needed=true

# Blocked dimensions: Dimensions no course can be set for, by id, comma-separated (like minecraft:the_end).
# (default )
blocked_dimensions=dimdoors:limbo, dimdoors:dungeon_pockets, dimdoors:personal_pockets, dimdoors:public_pockets, boogaloo_core:solemn_falls, pastel:deeper_down, timevortex:interior, timevortex:shipyard, timevortex:vortex

# Randomiser nearest: Nearest a Randomiser course can be. (default 1000; 0 to 10,000,000)
randomiser_min=1000

# Randomiser furthest: Furthest a Randomiser course can be. (default 10000; 1 to 10,000,000)
randomiser_max=10000

# Places per Memory Bank: Places each Memory Bank saves. (default 8; 1 to 64)
memory_bank_places=8

# ======== Vortex Trips ========

# Shortest cruise: Seconds in the vortex on the shortest trip. (default 10; 1 to 600)
cruise_shortest=10

# Longest cruise: Seconds in the vortex on the longest trip. (default 60; 1 to 3,600)
cruise_longest=60

# Cruise to another dimension: Fewest seconds in the vortex going to another dimension. (default 30; 1 to
# 3,600)
cruise_other_dimension=30

# Siphon share: Share of a trip's artron a Vortex Siphon wins back. (default 0.4; 0 to 1)
siphon_share=0.4

# ======== Flight Events ========

# Flight events: Things go wrong on vortex trips, and a console control must be worked to fix them. (default
# true; true or false)
flight_events=true

# Shortest gap: Fewest seconds between flight events. (default 15; 1 to 600)
event_gap_shortest=15

# Longest gap: Most seconds between flight events. (default 25; 1 to 600)
event_gap_longest=25

# Time to fix: Seconds to work the flashing control. (default 10; 1 to 120)
event_fix_time=10

# Misses to fall out: Missed events on one trip before the TARDIS falls out of the vortex. (default 4; 1 to
# 100)
misses_to_fall_out=4

# Drift when missed: Blocks the landing drifts off course on a missed event. (default 16; 0 to 10,000)
missed_drift=16

# Drain when missed: Share of the artron lost on a missed power drain. (default 0.2; 0 to 1)
missed_drain=0.2

# Helmic Regulator: How many times rarer events are with a Helmic Regulator. (default 2; 1 to 20)
helmic_regulator=2

# ======== Rifts and Crystals ========

# New rifts open: New rifts open now and then near players. (default true; true or false)
rifts_open=false

# New rift chance: A new rift opens near each player about once in this many minutes. (default 30; 1 to
# 100,000)
rift_chance=30

# Rift spacing: Fewest blocks between rifts. (default 48; 8 to 1,000)
rift_spacing=48

# Rift artron (least): Least artron a rift holds. (default 1000000; 1,000 to 1,000,000,000)
rift_artron_least=1000000

# Rift artron (most): Most artron a rift holds. (default 3000000; 1,000 to 1,000,000,000)
rift_artron_most=3000000

# Crystal growth: A rift grows its crystals one step about once in this many ticks. (default 600; 1 to
# 1,000,000)
crystal_growth=600

# Crystals per rift: Most crystals growing round one rift. (default 24; 0 to 200)
crystals_per_rift=0

# Rift flares: A rift near a player now and then flares open into the vortex for a few seconds. (default true;
# true or false)
rift_flares=false

# Flares pull things in: A flaring rift pulls in what's very near it. (default true; true or false)
rift_pull=false

# Rift Jars work: Rift Jars can catch and move rifts. (default true; true or false)
rift_jar=false

# ======== Machines ========

# Generator output: Artron a tick an Artron Generator makes while burning. (default 20; 1 to 1,000,000)
generator_rate=20

# Crystal burn time: Ticks an artron crystal burns in a generator. (default 4800; 1 to 1,000,000)
crystal_burn_time=4800

# Rift Collector output: Artron a tick a Rift Collector draws from its rift. (default 40; 1 to 1,000,000)
collector_rate=40

# Rift Collector range: How near its rift a Rift Collector must be. (default 4; 1 to 32)
collector_range=4

# Capacitor capacity: Artron an Artron Capacitor holds. (default 100000; 1,000 to 1,000,000,000)
capacitor_capacity=100000

# Capacitor rate: Most artron a tick a capacitor takes in and gives out. (default 400; 1 to 1,000,000)
capacitor_rate=400

# FE per artron: Other mods' power (FE) per artron, both ways. (default 2; 1 to 10,000)
fe_per_artron=2

# Air room size: Most blocks of sealed room an Atmospheric Generator fills. (default 2000; 8 to 100,000)
atmosphere_room=2000

# Rig charge: Artron the Rig needs for one conversion. (default 400000; 0 to 1,000,000,000)
rig_charge=400000

# Rig charge rate: Most artron a tick the Rig Controller takes in. (default 2000; 1 to 1,000,000)
rig_charge_rate=2000

# Rig size: Most blocks across the square of Rig Pylons. (default 33; 3 to 65)
rig_span=33

# ======== Police Box and Rig ========

# Room walls break: A TARDIS room's walls can be knocked through. (default true; true or false)
room_walls_break=true

# Keep busy boxes loaded: A police box with someone in its room keeps its chunk loaded. (default true; true or
# false)
keep_loaded=true

# Doorway view reach: Blocks of world sent for the view through open doors (more costs the server more).
# (default 48; 8 to 128)
doorway_view_reach=48

# ======== Owners and Keys ========

# Owners: A TARDIS belongs to whoever fitted its Matrix; others need its key to fly it. Off: anyone flies any
# TARDIS. (default true; true or false)
owners=true

# Only owner breaks: Only those who may fly a TARDIS can break its console. (default true; true or false)
only_owner_breaks=true

# Only owner opens doors: Only those who may fly a police box can open its doors from outside. (default true;
# true or false)
only_owner_doors=true

# Creative removes: A creative player can sneak-break any TARDIS to remove it. Off: only one who may fly it.
# (default true; true or false)
creative_removes=true

# ======== Scanner ========

# Scan range: Chunks round it a Scanner finds TARDISes and rifts in. (default 12; 1 to 64)
scan_range=12

# Structure range: Chunks round it a Scanner looks for structures in. (default 64; 1 to 256)
scan_structures=64

# Biome range: Blocks round it a Scanner looks for biomes in. (default 6400; 64 to 32,000)
scan_biomes=6400

# Finds players: A Scanner lists the players in its dimension. (default true; true or false)
scan_players=true

# ======== World ========

# Chunks kept loaded: Chunks round a flying TARDIS kept loaded. (default 3; 2 to 8)
travel_chunks=3

# Zeiton-7 veins: Zeiton-7 ore veins in each new chunk, deep underground (0: none). (default 4; 0 to 64)
zeiton_veins=0

# Cinnabar veins: Cinnabar ore tries in each new mountain chunk (small veins; 0: none). (default 100; 0 to
# 256)
cinnabar_veins=0

# Buried cinnabar veins: Cinnabar ore tries underground in each new chunk of any overworld biome, on top of
# the mountains' (0: none). (default 12; 0 to 256)
buried_cinnabar_veins=0

# Nether cinnabar veins: Cinnabar ore veins in each new Nether chunk (0: none). (default 8; 0 to 64)
nether_cinnabar_veins=0

# Rift rarity: About one new chunk in this many has a rift in it (0: none). (default 36; 0 to 100,000)
rift_rarity=0

# ======== Other Mods ========

# Sable physics: With Create Aeronautics (Sable) installed, a flying TARDIS is a Sable physics body. (default
# true; true or false)
sable_bodies=true

# Carry Aeronautics ships: Create Aeronautics ships on a TARDIS go with it through the vortex. (default true;
# true or false)
carry_aeronautics=true

# Earth gravity aboard: With Ad Astra, a TARDIS with air keeps Earth's gravity inside. (default true; true or
# false)
adastra_gravity=true
