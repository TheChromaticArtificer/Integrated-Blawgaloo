[general]
	# Default: 15
	# Range: 0 ~ 1000000
	atmosphereStartDay = 15
	# Default: 21
	# Range: 0 ~ 1000000
	startDay = 21

[sightings]
	# Default: 1800
	# Range: 0 ~ 86400
	cooldownSeconds = 1800
	# Default: 3600
	# Range: 1 ~ 86400
	minIntervalSeconds = 3600
	# Default: 7200
	# Range: 1 ~ 86400
	maxIntervalSeconds = 7200
	#Stands 35-46 blocks away watching; vanishes if approached within 20 blocks.
	stalking = true
	#Appears a few blocks behind the player; vanishes when seen.
	creeping = true
	#Appears 70-100 blocks away; vanishes when seen.
	lurking = true
	#Chance per second, per enabled sighting type, during the day.
	# Default: 0.006
	# Range: 0.0 ~ 1.0
	daySightingChancePerSecond = 0.006
	#Chance per second, per enabled sighting type, at night.
	# Default: 0.0075
	# Range: 0.0 ~ 1.0
	nightSightingChancePerSecond = 0.0075
	#A creeping sighting the player walks into darkens their screen with a scare sound.
	jumpscare = true
	#Plays a cave sound the moment the player spots him.
	spotSound = true
	#He can be spotted through glass, not only in open line of sight.
	windowWatcher = true
	#Players can't sleep while he is within 8 blocks.
	noSleep = true
	#Sitting tamed wolves within 30 blocks bristle and whine at him.
	wolfReaction = true

	[sightings.nightmare]
		#Appears beside the bed when a player falls asleep, with darkness.
		enabled = true
		#Chance per sleep.
		# Default: 0.0075
		# Range: 0.0 ~ 1.0
		chance = 0.0075
		#A Witchery Dream Weaver of Nightmares near the bed stops nightmare sightings.
		dreamWeaverWard = true
		# Default: 4
		# Range: 1 ~ 16
		wardRadius = 4

	[sightings.sinisterSigns]
		#When spotted through glass, he may leave a sign where he stood.
		enabled = true
		#Chance per through-glass spotting.
		# Default: 0.02
		# Range: 0.0 ~ 1.0
		chance = 0.02

	[sightings.wandering]
		#Domain dimensions only: walks toward the player in plain sight and keeps coming when looked at.
		#If he reaches the player, they are sent back to the Overworld.
		enabled = true
		# Default: 60
		# Range: 5 ~ 600
		lifetimeSeconds = 60
		#Blocks per tick.
		# Default: 0.07
		# Range: 0.01 ~ 0.5
		speed = 0.07

[appearance]
	#Skin used when randomizeSkins is off.
	skin = "default"
	#Pick a random skin for each sighting.
	randomizeSkins = false
	glowingEyes = true

#Tracked-block events (candles, curse, donation, burning) only fire when no player is within
#100 blocks (50 for chests and beds), roll at most once per world day, and affect every
#matching tracked block within 50 blocks of the chosen one.
[events]
	#A Herobrine shrine's fire relights itself when no one is near.
	rekindleShrine = true

	[events.footsteps]
		#Footstep sounds a few blocks behind the player.
		enabled = true
		#Chance per player per second.
		# Default: 6.0E-4
		# Range: 0.0 ~ 1.0
		chance = 6.0E-4

	[events.ghostMining]
		#While the player is in a stone tunnel, something mines inside the stone
		#4-6 blocks to their side, then leaves a redstone torch in the hollow.
		enabled = true
		#Chance per player per second.
		# Default: 0.0025
		# Range: 0.0 ~ 1.0
		chance = 0.0025

	[events.ghostDoor]
		#Player-placed doors open by themselves at night.
		enabled = true
		#Chance per door per scan (every 2 seconds).
		# Default: 8.0E-4
		# Range: 0.0 ~ 1.0
		chance = 8.0E-4
		#Chance a ghost door is followed by a stalking sighting.
		# Default: 0.02
		# Range: 0.0 ~ 1.0
		stalkingChance = 0.02

	[events.chilledCandles]
		#Lit candles go out together.
		enabled = true
		#Chance per day.
		# Default: 0.005
		# Range: 0.0 ~ 1.0
		chance = 0.005

	[events.crimsonCurse]
		#Torches turn into redstone torches and lanterns into soul lanterns.
		enabled = true
		#Chance per day.
		# Default: 0.003
		# Range: 0.0 ~ 1.0
		chance = 0.003

	[events.dreadfulDonation]
		#Leaves an unsettling gift in a player-placed chest.
		enabled = true
		#Chance per day.
		# Default: 0.008
		# Range: 0.0 ~ 1.0
		chance = 0.008

	[events.burningBase]
		#Sets fire around beds. Destructive; off by default.
		enabled = false
		#Chance per day.
		# Default: 0.125
		# Range: 0.0 ~ 1.0
		chance = 0.125

[witchery]
	#In Witchery's dream worlds, his jumpscare wakes you, using Witchery's own Icy Needle return.
	nightmareWake = true

	[pockets.ghostDimensionalDoors]
		#Doors near a player in a pocket dimension open by themselves.
		enabled = true
		#Chance per player per second.
		# Default: 0.004
		# Range: 0.0 ~ 1.0
		chance = 0.004

	[pockets.trespass]
		#Coming back to your personal pocket, you find signs he was there.
		enabled = true
		#Chance per return.
		# Default: 0.12
		# Range: 0.0 ~ 1.0
		chance = 0.12

	[pockets.dungeonShrine]
		#Entering a dungeon pocket, you find a lit shrine and his chest, and he is watching.
		enabled = true
		#Chance per dungeon pocket entered.
		# Default: 0.04
		# Range: 0.0 ~ 1.0
		chance = 0.04

[generatedWorlds]
	#Chance an Infinite Dimensions world is one of his worlds (decided once per world, from its ID).
	# Default: 0.05
	# Range: 0.0 ~ 1.0
	hisWorldChance = 0.05
	#His worlds are always night for players inside them.
	hisWorldNight = true
	#Chance a newly generated chunk in his world gets one of his structures.
	# Default: 0.06
	# Range: 0.0 ~ 1.0
	hisWorldStructureChance = 0.06
	# Default: 2.0
	# Range: 0.0 ~ 100.0
	hisWorldSightingMultiplier = 2.0

	[generatedWorlds.glitch]
		#A sighting in a generated world glitches: his face flickers, sound cuts out, the screen tears.
		enabled = true
		#Chance per sighting.
		# Default: 0.35
		# Range: 0.0 ~ 1.0
		chance = 0.35

[extras]
	#Black Panther's Heightened Senses reveal him, and he notices you back.
	pantherSenses = true

	[extras.gravestone]
		#Returning to where you died, he may be standing by your grave.
		enabled = true
		#Chance per death.
		# Default: 0.35
		# Range: 0.0 ~ 1.0
		chance = 0.35

	[extras.securityCameras]
		#While viewing through a SecurityCraft camera, he can show up on the feed.
		enabled = true
		#Chance per second of viewing.
		# Default: 0.01
		# Range: 0.0 ~ 1.0
		chance = 0.01

	[extras.nightmareStorm]
		#A nightmare sighting can bring a Weather2 storm overhead.
		enabled = true
		#Chance per nightmare sighting.
		# Default: 0.15
		# Range: 0.0 ~ 1.0
		chance = 0.15

#Which dimensions he haunts and how hard. Entries are dimension IDs; a trailing * matches a prefix.
#Dimensions not listed are dormant (nothing happens).
[presence]
	#Never haunted; something else owns these spaces.
	excludedDimensions = ["dimdoors:limbo", "boogaloo_core:solemn_falls", "antarchy:thoraxis"]
	rumorDimensions = ["minecraft:overworld"]
	hauntedDimensions = ["witchery:dream_world", "witchery:nightmare_world"]
	domainDimensions = ["dimdoors:personal_pockets", "dimdoors:public_pockets", "dimdoors:dungeon_pockets", "infinity:generated_*"]
	#Extra per-dimension multiplier on sighting and event chances, as "dimension=multiplier".
	dimensionMultipliers = []

	[presence.rumor]
		# Default: 1.0
		# Range: 0.0 ~ 100.0
		sightingChanceMultiplier = 1.0
		# Default: 1.0
		# Range: 0.0 ~ 100.0
		eventChanceMultiplier = 1.0
		#Sighting types allowed here: stalking, creeping, lurking, nightmare, wandering.
		modes = ["stalking", "creeping", "lurking", "nightmare"]

	[presence.haunted]
		# Default: 1.5
		# Range: 0.0 ~ 100.0
		sightingChanceMultiplier = 1.5
		# Default: 1.5
		# Range: 0.0 ~ 100.0
		eventChanceMultiplier = 1.5
		#Sighting types allowed here: stalking, creeping, lurking, nightmare, wandering.
		modes = ["stalking", "creeping", "lurking", "nightmare"]

	[presence.domain]
		# Default: 3.0
		# Range: 0.0 ~ 100.0
		sightingChanceMultiplier = 3.0
		# Default: 2.0
		# Range: 0.0 ~ 100.0
		eventChanceMultiplier = 2.0
		#Sighting types allowed here: stalking, creeping, lurking, nightmare, wandering.
		modes = ["stalking", "creeping", "lurking", "nightmare", "wandering"]

[solemnFalls]
	#Throwing a Lucid Pearl while falling in Limbo takes the thrower down to the Solemn Falls.
	lucidPearlDescent = true
	# Default: 40
	# Range: 0 ~ 400
	descentDelayTicks = 40
	#Blocks the fight changes put themselves back after this long.
	# Default: 8
	# Range: 1 ~ 120
	arenaDamageRestoreSeconds = 8

	#He shows up behind players on the puzzle floors (not the arena) and is gone when they turn round.
	[solemnFalls.sightings]
		enabled = true
		#Shortest wait between sightings for one player.
		# Default: 15
		# Range: 1 ~ 3600
		minSeconds = 15
		#Longest wait between sightings for one player.
		# Default: 40
		# Range: 1 ~ 3600
		maxSeconds = 40
		#Share of sightings where he stands far off down a corridor instead of right behind.
		# Default: 0.25
		# Range: 0.0 ~ 1.0
		stalkChance = 0.25

	#On-screen hints for players stuck on a floor, plainer each time.
	[solemnFalls.hints]
		enabled = true
		#Minutes on a floor before the first, second and third hint.
		minutes = [4, 8, 12]
		#After the last hint, it shows again this often until they climb up.
		# Default: 3
		# Range: 1 ~ 120
		repeatMinutes = 3

#Herobrine boss in the Solemn Falls. These are final values; mob_scaling.js skips him.
[boss]
	# Default: 9000.0
	# Range: 1.0 ~ 1000000.0
	health = 9000.0
	# Default: 45.0
	# Range: 0.0 ~ 10000.0
	attackDamage = 45.0
	# Default: 20.0
	# Range: 0.0 ~ 30.0
	armor = 20.0
	# Default: 8.0
	# Range: 0.0 ~ 20.0
	armorToughness = 8.0
	# Default: 0.3
	# Range: 0.05 ~ 1.0
	movementSpeed = 0.3
	#Largest amount a single hit can deal before armor.
	# Default: 833.3333
	# Range: 1.0 ~ 1000000.0
	singleHitCap = 833.3333
	#Total damage he can take in any one second.
	# Default: 150.0
	# Range: 1.0 ~ 1000000.0
	damagePerSecondCap = 150.0
	# Default: 0.35
	# Range: 0.0 ~ 10.0
	healthPerExtraPlayer = 0.35
	# Default: 0.1
	# Range: 0.0 ~ 10.0
	damagePerExtraPlayer = 0.1
	# Default: 4
	# Range: 1 ~ 16
	maxScaledPlayers = 4
	#Players who have defeated him get no more sightings or events anywhere.
	endHauntingForVictors = true

	[boss.interludes]
		#"Who's real?" ends on its own after this long.
		# Default: 25
		# Range: 5 ~ 600
		whosRealTimeoutSeconds = 25
		#"Find the door" ends on its own after this long.
		# Default: 30
		# Range: 5 ~ 600
		findTheDoorTimeoutSeconds = 30

	[boss.abilities]
		#Most summoned mobs alive at once.
		# Default: 6
		# Range: 0 ~ 32
		maxSummons = 6
		weepingAngels = true
		dreadHallucinations = true
		chaosMobs = true
		monoliths = true
		realityPatches = true
		ghostTunnels = true
		radiationBurst = true
		coldBreath = true
		#A copy of one player, in their skin and armor with his white eyes, hunts them.
		doppelganger = true
		# Default: 300.0
		# Range: 1.0 ~ 100000.0
		doppelgangerHealth = 300.0
		# Default: 40.0
		# Range: 0.0 ~ 10000.0
		doppelgangerDamage = 40.0
		#Share of damage Herobrine ignores while any doppelganger is alive.
		# Default: 0.5
		# Range: 0.0 ~ 1.0
		doppelgangerDamageReduction = 0.5

	[boss.echoes]
		#Distorted, colorless copies of other bosses join the fight for a short time.
		#They drop nothing, give no XP and vanish instead of dying.
		enabled = true
		bosses = ["marvel:red_skull", "marvel:winter_soldier", "marvel:baron_zemo", "witchery:lilith", "witchery:death", "electric_boogaloo:electric_boogaloo", "antarchy:toreterror", "antarchy:hercules_beetle", "antarchy:emperor_scorpion", "antarchy:alpha_mantis", "minecraft:warden", "mutantmonsters:mutant_zombie"]
		# Default: 400.0
		# Range: 1.0 ~ 100000.0
		health = 400.0
		# Default: 15
		# Range: 3 ~ 120
		durationSeconds = 15
		#The screen drains to black and white while an echo is near.
		desaturateScreen = true

	#Phase one moves borrowed from the Reality Stone.
	[boss.realityStone]
		#Shortest gap between two Reality Stone moves.
		# Default: 3
		# Range: 0 ~ 60
		moveGapSeconds = 3
		#Hitting one of his fakes outside "Who's real?" turns it into a chicken.
		decoyChickens = true

		[boss.realityStone.looming]
			#He grows while nobody is looking at him and shrinks back while watched.
			enabled = true
			# Default: 0.15
			# Range: 0.0 ~ 5.0
			growPerSecond = 0.15
			# Default: 0.3
			# Range: 0.0 ~ 5.0
			shrinkPerSecond = 0.3
			# Default: 2.5
			# Range: 1.0 ~ 10.0
			maxScale = 2.5
			#His hits scale with his size, up to this multiplier.
			# Default: 1.75
			# Range: 1.0 ~ 10.0
			maxDamageMultiplier = 1.75

		[boss.realityStone.shrink]
			#A ring marks a player; anyone still in it when it closes is shrunk.
			enabled = true
			# Default: 0.5
			# Range: 0.05 ~ 1.0
			scale = 0.5
			# Default: 8
			# Range: 1 ~ 120
			durationSeconds = 8
			# Default: 14
			# Range: 1 ~ 600
			cooldownSeconds = 14

		[boss.realityStone.wallPaste]
			#He copies a piece of nearby wall and pastes it between a player and himself.
			enabled = true
			# Default: 12
			# Range: 1 ~ 600
			cooldownSeconds = 12
			# Default: 10
			# Range: 1 ~ 600
			restoreSeconds = 10

		[boss.realityStone.rewriteFloor]
			#The floor under a player flickers through other blocks, then turns to slime or drops away.
			enabled = true
			# Default: 10
			# Range: 1 ~ 600
			cooldownSeconds = 10
			# Default: 8
			# Range: 1 ~ 600
			restoreSeconds = 8

[strongholds]
	#Players inside one of his strongholds in the world are watched far more often.
	enabled = true
	#Structures that count as his strongholds.
	structures = ["ati_structures:herobrine_stronghold"]
	#Chance per player every two seconds inside a stronghold that he appears.
	# Default: 0.12
	# Range: 0.0 ~ 1.0
	sightingChance = 0.12
	#Entering a stronghold starts the haunting early.
	startsHaunting = true
