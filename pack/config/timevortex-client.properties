# The Time Vortex Mod: this game's own settings (what it draws, shows and plays).
# Edit here or on the in-game settings screen. A change here is picked up within a second or two.

# ======== Doorways ========

# Views through doors: Draw what's through a TARDIS's open doors (its room from outside, the world from
# inside). Off: plain doorways, more frames on a slow computer. (default true; true or false)
boti_rendering=true

# Doorway view distance: Open doorways further than this many blocks away are drawn plain. (default 64; 16 to
# 256)
doorway_distance=64

# Levels kept: Levels walked out of kept ready to walk back into without loading. (default 2; 1 to 4)
levels_kept=2

# Kept for (minutes): How long a level walked out of stays ready. (default 15; 1 to 120)
levels_kept_minutes=15

# Rain through doors: Hear the rain outside through a police box's open doors. (default true; true or false)
rain_through_doors=true

# ======== Vortex ========

# Tunnel detail: How smooth the vortex's tunnels are. (default normal; low, normal, high)
tunnel_detail=normal

# Tunnel range: Furthest blocks of tunnel drawn (also kept within the render distance). (default 288; 128 to
# 512)
tunnel_range=288

# Lightning: Lightning in the vortex's walls. (default true; true or false)
lightning=true

# Lightning flash: How brightly the walls flash with lightning (0%: no flash). (default 1; 0 to 1)
lightning_flash=1

# Region colours: Each dimension's part of the vortex has its own colour. (default true; true or false)
region_colours=true

# Tear distance: Furthest blocks tears in space are drawn. (default 256; 32 to 512)
tear_distance=256

# Screen flash: How bright the screen flashes passing through a rift in the vortex (0%: no flash). (default 1;
# 0 to 1)
rift_flash=1

# ======== Effects ========

# Demat echoes: Fading copies trail a dematerialising TARDIS. (default true; true or false)
transit_echoes=true

# Energy arcs: Energy arcs over the hull as it fades. (default true; true or false)
transit_arcs=true

# Console sparks: Sparks from a console in trouble. (default true; true or false)
console_sparks=true

# Hull block effects: Torches smoke and furnaces crackle on a flying hull. (default true; true or false)
ship_block_effects=true

# Cloak shimmer: A cloaking police box bends the light behind it. (default true; true or false)
cloak_shimmer=true

# Air bubbles: Show the Atmospheric Generator's bubbles of air. (default true; true or false)
air_bubbles=true

# Camera shake: How hard the view shakes when a TARDIS hits something (0: none). (default 1; 0 to 2)
shake=1

# Scaled view bob: When you're shrunk or grown, view bobbing scales with you. (default true; true or false)
scaled_bob=true

# ======== Helm and HUD ========

# Helm dashboard: Show speed, fuel and course at the helm, in place of the hotbar. (default true; true or
# false)
helm_hud=true

# Key hints: Show the helm's keys along the bottom. (default true; true or false)
helm_key_hints=true

# Course label: Show where you're aiming a course under the crosshair. (default true; true or false)
aim_label=true

# Control names: Name the console control you're looking at. (default true; true or false)
control_labels=true

# Control hints: Say what the control does under its name. (default true; true or false)
control_hints=true

# Alarm glow: The screen's edges pulse red during a flight event. (default true; true or false)
alarm_cue=true

# Alarm arrow: An arrow points to the flashing control when it's off screen. (default true; true or false)
alarm_arrow=true

# Low fuel warning: The fuel gauge turns red below this share. (default 0.15; 0 to 1)
low_fuel=0.15

# ======== Camera ========

# Helm camera distance: Multiplies how far behind the TARDIS the helm's camera sits. (default 1; 0.5 to 3)
helm_camera_distance=1

# Helm camera height: Blocks above the hull the helm's camera looks at. (default 1.5; 0 to 10)
helm_camera_height=1.5

# Keep camera out of walls: The helm's camera stops short of terrain. (default true; true or false)
helm_camera_clip=true

# Invert throttle scroll: Scroll down for more throttle at the helm. (default false; true or false)
invert_throttle_scroll=false

# ======== Sound ========

# Hum volume: How loud a TARDIS hums in flight and in its room. (default 1; 0 to 1)
hum_volume=1

# Helm clicks: Click when aiming or cancelling a course at the helm. (default true; true or false)
helm_clicks=true

# ======== Performance ========

# Monitor refresh: Times a second a console's monitor redraws. (default 10; 1 to 20)
monitor_fps=10

# Shader pack mode: Draw effects the way shader packs need. Auto: when Iris has a pack on. (default auto;
# auto, on, off)
shader_pack_mode=auto

# Load ahead: Load the mod's code in the background at start, so the first flight doesn't stutter. (default
# true; true or false)
warmup=true
