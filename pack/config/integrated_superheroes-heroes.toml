	#Keeps the Viltrumite mod from interfering with other mods.
	[viltrumite.safeguards]
		#Only takes away flight the Viltrumite mod gave. Without this, their mod removes flight from every player who isn't a Viltrumite, every tick, breaking flight from other mods. Grabbed players get their own flight back when released.
		protectOtherFlight = true
		#Stops the Viltrumite mod from cancelling teleports from commands and other mods during Super Speed and dashes, and limits its anti-cheat bypass to movement checks.
		protectTeleports = true
		#Damage tagged to bypass invulnerability or resistance ignores Viltrumite damage reduction and blocking.
		respectBypassDamage = true
		#Effects in the integrated_superheroes:viltrumite_bypass tag can still be given to Viltrumites, who otherwise reject every harmful effect.
		allowBypassEffects = true
		#Limits Viltrumite pose, hand, FOV and screen shader changes to Viltrumites and fliers so they don't override other mods' animations and effects.
		limitVisuals = true
		#Runs Viltrumite punch, chop and Thunderclap physics once per tick instead of once per player, skips their grab checks for entities nobody is holding, and sends grab hand positions once per tick instead of every frame.
		performanceFixes = true
