	serumOnly = true
	takeoffBreaksBlocks = true
	#Caps the damage reduction of Viltrumite NPCs like Conquest (98.5 by default in their mod) so heroes can hurt them.
	# Default: 85.0
	# Range: 0.0 ~ 100.0
	npcMaxDamageReductionPercent = 85.0
	# Default: 3
	# Range: 0 ~ 64
	npcBloodSampleDrops = 1
