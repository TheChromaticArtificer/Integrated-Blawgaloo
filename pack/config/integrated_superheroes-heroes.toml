	#Iron Man / War Machine suit abilities on Marvel Legacy's ability hotkeys, granted while a full suit is worn.
	#damageMultiplier is a multiple of the worn mark's repulsorDamage (Proton Cannon: of its unibeamDamage, per hit).
	#energyCost is out of the chestplate's 100.
	[ironMan.abilities]
		#Master switch for suit abilities.
		enabled = true

		[ironMan.abilities.missiles]
			#Missiles may target other players (only when the server has PvP on, never teammates).
			targetPlayers = true
			#How far the crosshair lock-on reaches.
			# Default: 48.0
			# Range: 1.0 ~ 256.0
			lockRange = 48.0
			#How far auto-targeting looks when nothing is under the crosshair.
			# Default: 32.0
			# Range: 1.0 ~ 256.0
			coneRange = 32.0
			#Half-angle of the auto-targeting cone.
			# Default: 35.0
			# Range: 1.0 ~ 180.0
			coneDegrees = 35.0
			#How sharply a micro-missile can turn per tick.
			# Default: 10.0
			# Range: 0.0 ~ 180.0
			turnDegreesPerTick = 10.0
			#Micro-missiles deal half damage to other valid targets within this radius.
			# Default: 2.0
			# Range: 0.0 ~ 16.0
			splashRadius = 2.0

		[ironMan.abilities.afterburner]
			# Default: 4.0
			# Range: 0.0 ~ 3600.0
			cooldownSeconds = 4.0
			# Default: 5.0
			# Range: 0.0 ~ 100.0
			energyCost = 5.0
			# Default: 1.0
			# Range: 0.0 ~ 1000.0
			damageMultiplier = 1.0
			# Default: 2.2
			# Range: 0.0 ~ 10.0
			speed = 2.2
			#How long the dash damages mobs it passes through.
			# Default: 8
			# Range: 1 ~ 100
			damageTicks = 8

		[ironMan.abilities.microMissiles]
			# Default: 8.0
			# Range: 0.0 ~ 3600.0
			cooldownSeconds = 8.0
			# Default: 10.0
			# Range: 0.0 ~ 100.0
