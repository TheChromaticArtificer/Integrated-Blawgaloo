#Herobrine morph (Morph mod). Cooldowns and slots live in data/boogaloo_core/morph/mob/herobrine.json;
#health, armor and damage live in that file's attributeOverrides.
[herobrine_morph]
	#Lights Out may take light blocks away for a while. Off: it only blinds and darkens.
	morphWorldEdits = true
	#Wrong Side of the Floor may flip players' and mobs' gravity.
	morphGravityFlips = true
	#Holding an ability key at least this long uses its hold move instead of its tap move.
	# Default: 8
	# Range: 1 ~ 100
	holdTicks = 8

	[herobrine_morph.behind_you]
		# Default: 16.0
		# Range: 1.0 ~ 64.0
		range = 16.0
		# Default: 12
		# Range: 0 ~ 100
		swingDelayTicks = 12
		# Default: 3.5
		# Range: 1.0 ~ 16.0
		reach = 3.5
		#The auto swing deals your attack damage times this.
		# Default: 1.5
		# Range: 0.0 ~ 100.0
		damageMultiplier = 1.5

	[herobrine_morph.reality_rewrite]
		# Default: 24.0
		# Range: 1.0 ~ 64.0
		transmuteRange = 24.0
		#Mobs with more max health than this can't be transmuted. Bosses and players never can.
		# Default: 150.0
		# Range: 1.0 ~ 100000.0
		transmuteMaxHealth = 150.0
		transmuteInto = "minecraft:chicken"
		#Whether name-tagged and tamed mobs can be transmuted.
		transmuteNamedAndTamed = false
		# Default: 4.0
		# Range: 1.0 ~ 32.0
		shrinkRadius = 4.0
		#Ticks between the ring appearing and it closing.
		# Default: 12
		# Range: 0 ~ 100
		shrinkDelayTicks = 12
		# Default: 0.5
		# Range: 0.05 ~ 1.0
		shrinkScale = 0.5
		# Default: 10
		# Range: 1 ~ 600
		shrinkSeconds = 10

	[herobrine_morph.whos_real]
		# Default: 4
		# Range: 1 ~ 16
		decoys = 4
		# Default: 10
		# Range: 1 ~ 600
		decoySeconds = 10
		#Mobs this close that are after you go after a decoy instead.
		# Default: 32.0
		# Range: 0.0 ~ 128.0
		retargetRange = 32.0

	[herobrine_morph.wrath]
		# Default: 48.0
		# Range: 1.0 ~ 128.0
		strikeRange = 48.0
		# Default: 24
		# Range: 0 ~ 100
		strikeDelayTicks = 24
		# Default: 10.0
		# Range: 1.0 ~ 64.0
		coldBreathRange = 10.0
		# Default: 25
		# Range: 0 ~ 100
		coldBreathDelayTicks = 25
		# Default: 8.0
		# Range: 1.0 ~ 64.0
		radiationRadius = 8.0
		#Extra magic damage the cold breath and radiation burst deal to each target.
		# Default: 12.0
		# Range: 0.0 ~ 10000.0
		damage = 12.0

	[herobrine_morph.lights_out]
		# Default: 12
		# Range: 1 ~ 48
		radius = 12
		#Most light blocks taken per use.
		# Default: 128
		# Range: 0 ~ 4096
		limit = 128
		# Default: 15
		# Range: 1 ~ 600
		seconds = 15
		#Blindness for other players in range. Mobs get Darkness and lose you as a target.
		# Default: 5
		# Range: 0 ~ 600
		blindSeconds = 5
		#Wrong Side of the Floor, the hold move on the Lights Out key.
		# Default: 6.0
		# Range: 1.0 ~ 32.0
		wrongSideRadius = 6.0
		# Default: 4
		# Range: 1 ~ 60
		wrongSideSeconds = 4

	[herobrine_morph.gaze]
		#Chance a melee hit from something you aren't looking at misses.
		# Default: 0.5
		# Range: 0.0 ~ 1.0
		missChance = 0.5
		#Whether player hits can miss too, not just mobs.
		affectsPlayers = false

	[herobrine_morph.looming]
		#You grow while nobody is looking at you and snap back when someone does.
		enabled = true
		# Default: 1.25
		# Range: 1.0 ~ 4.0
		maxScale = 1.25
		# Default: 0.05
		# Range: 0.0 ~ 5.0
		growPerSecond = 0.05
		#Players and mobs this close count as looking.
		# Default: 32.0
		# Range: 1.0 ~ 128.0
		range = 32.0
