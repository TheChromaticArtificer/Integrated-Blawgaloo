[villains]
	#Fight logic for Baron Zemo, the Winter Soldier, Red Skull and Hydra agents.
	enabled = true
	#Extra boss health per additional player nearby when the fight starts (0.6 = +60%).
	# Default: 0.6
	# Range: 0.0 ~ 10.0
	healthPerExtraPlayer = 0.6
	#Bosses stay within this many blocks of where their fight started.
	# Default: 18.0
	# Range: 6.0 ~ 128.0
	leashRadius = 18.0

[zemo]
	enabled = true
	# Default: 400.0
	# Range: 1.0 ~ 100000.0
	health = 400.0
	# Default: 12.0
	# Range: 0.0 ~ 30.0
	armor = 12.0
	#Most damage one hit can deal.
	# Default: 30.0
	# Range: 1.0 ~ 100000.0
	perHitCap = 30.0
	#Damage per second allowed over a rolling 5 seconds before further damage is cut to 10%.
	# Default: 8.0
	# Range: 0.5 ~ 100000.0
	dpsCap = 8.0

[winter_soldier]
	enabled = true
	# Default: 500.0
	# Range: 1.0 ~ 100000.0
	health = 500.0
	# Default: 12.0
	# Range: 0.0 ~ 30.0
	armor = 12.0
	#Most damage one hit can deal.
	# Default: 35.0
	# Range: 1.0 ~ 100000.0
	perHitCap = 35.0
	#Damage per second allowed over a rolling 5 seconds before further damage is cut to 10%.
	# Default: 9.0
	# Range: 0.5 ~ 100000.0
	dpsCap = 9.0
	#How long the Winter Soldier fights for the Red Book's reader before he breaks free.
	# Default: 300
	# Range: 10 ~ 3600
	redBookAllySeconds = 300

[red_skull]
	enabled = true
	# Default: 600.0
	# Range: 1.0 ~ 100000.0
	health = 600.0
	# Default: 14.0
	# Range: 0.0 ~ 30.0
	armor = 14.0
	#Most damage one hit can deal.
	# Default: 40.0
	# Range: 1.0 ~ 100000.0
	perHitCap = 40.0
	#Damage per second allowed over a rolling 5 seconds before further damage is cut to 10%.
	# Default: 9.0
	# Range: 0.5 ~ 100000.0
	dpsCap = 9.0
	#Damage multiplier for Red Skull's Tesseract charges (Marvel's base is 4).
	# Default: 3.5
	# Range: 0.0 ~ 100.0
	tesseractChargeMultiplier = 3.5
	#Damage multiplier for Tesseract charges fired by Hydra agents.
	# Default: 2.0
	# Range: 0.0 ~ 100.0
	agentTesseractChargeMultiplier = 2.0

[hydra]
	#Hydra agents get a squad role and a matching weapon (guns when Scorched Guns is installed).
	armWithGuns = true
	#Agents within this range join in when one is hurt or spots a player.
	# Default: 24.0
	# Range: 4.0 ~ 128.0
	alertRadius = 24.0
	#Radius of an alarm: every agent and boss inside it converges on the intruder.
	# Default: 48.0
	# Range: 8.0 ~ 256.0
	alarmRadius = 48.0
	#Most agents officers can call in during one alarm.
	# Default: 6
	# Range: 0 ~ 64
	reinforcementsPerAlarm = 6
	#Chance an armed agent drops its weapon.
	# Default: 0.03
	# Range: 0.0 ~ 1.0
	gunDropChance = 0.03
	#Saying "Hail Hydra" in chat makes Hydra agents ignore you for a while. Bosses aren't fooled.
	hailHydra = true
	#How long Hydra agents ignore you after you say it. Attacking a Hydra fighter ends it early.
	# Default: 300
	# Range: 1 ~ 86400
	hailHydraSeconds = 300
	#Seconds after saying it before it works again.
	# Default: 900
	# Range: 0 ~ 86400
	hailHydraCooldownSeconds = 900
